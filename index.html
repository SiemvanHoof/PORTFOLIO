<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Siem van Hoof — Web Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>

    <section class="hero">

      <header class="hero-nav">
        <a href="#" class="logo-mark" aria-label="Home">
          <span class="logo-dots">
            <span></span><span></span><span></span><span></span>
          </span>
        </a>

        <div class="pill-nav">
          <button class="pill-nav__item" type="button">
            <span class="hamburger"><span></span></span>
            <span>Menu</span>
          </button>
          <button class="pill-nav__icon theme-toggle" type="button" aria-label="Donkere modus">🌙</button>
        </div>

        <a href="mailto:jouw@email.hier" class="btn-dark">Contact</a>
      </header>

      <!-- Foto-cluster: placeholders in dezelfde organische blob-vormen als het voorbeeld.
           Vervang de <div class="blob__ph"> straks door <img> van je eigen projecten. -->
      <div class="photo-cluster" aria-hidden="true">
        <div class="blob blob--1"><div class="blob__ph"></div></div>
        <div class="blob blob--2"><div class="blob__ph"></div></div>
        <div class="blob blob--3"><div class="blob__ph"></div></div>
        <div class="blob blob--4"><div class="blob__ph"></div></div>
        <div class="blob blob--5"><div class="blob__ph"></div></div>
        <div class="blob blob--6"><div class="blob__ph"></div></div>
        <div class="blob blob--7"><div class="blob__ph"></div></div>
        <div class="blob blob--8"><div class="blob__ph"></div></div>

        <a href="mailto:jouw@email.hier" class="upload-card">
          <span class="upload-card__icon">✎</span>
          <span class="upload-card__label">Nieuw project?</span>
        </a>
      </div>

      <div class="tag-stack" aria-hidden="true">
        <span class="tag tag--faded">Design</span>
        <span class="tag">React</span>
        <span class="tag">Node.js</span>
        <span class="tag">WordPress</span>
        <span class="tag">E-commerce</span>
        <span class="tag tag--faded">SEO</span>
      </div>

      <div class="hero-statement">
        <p class="hero__eyebrow">Lorem ipsum dolor sit amet</p>
        <h1 class="hero__pitch">
          Lorem ipsum dolor,<br>
          <span class="hero__pitch--muted">sit amet consectetur.</span>
        </h1>
      </div>

      <span class="copyright">©2026</span>

      <div class="scroll-cue">
        <span>Scroll</span>
        <span class="scroll-dot" aria-hidden="true">✦</span>
      </div>

    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
